name: EAS Preview

on:
  pull_request:
    branches: [main, master]

jobs:
  preview:
    name: EAS Preview Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Login to Expo
        run: echo "${{ secrets.EXPO_TOKEN }}" | eas login --token

      - name: Build preview client (Android)
        if: success()
        run: eas build --profile preview --platform android --non-interactive --auto-submit
        env:
          EAS_PROJECT_ID: ${{ secrets.EAS_PROJECT_ID }}

      - name: Build preview client (iOS)
        if: success()
        run: eas build --profile preview --platform ios --non-interactive --auto-submit
        env:
          EAS_PROJECT_ID: ${{ secrets.EAS_PROJECT_ID }}
